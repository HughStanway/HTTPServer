name: Format

on:
  pull_request:
    branches: [ main ]
  push :
    branches: [ main ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find . -regex '.*\.\(cpp\|hpp\|h\)' \
          -exec clang-format --dry-run --Werror {} +
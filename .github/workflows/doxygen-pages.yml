name: Publish Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build Site
        run: |
          # We use a custom run instead of 'make docs' to avoid venv overhead in CI
          # But we still use the logic from the Makefile
          mkdir -p docs/_build/doxygen
          sed \
            -e 's|^OUTPUT_DIRECTORY.*|OUTPUT_DIRECTORY       = "docs/_build/doxygen"|' \
            -e 's|^GENERATE_HTML.*|GENERATE_HTML          = NO|' \
            -e 's|^GENERATE_XML.*|GENERATE_XML           = YES|' \
            -e 's|^XML_OUTPUT.*|XML_OUTPUT             = xml|' \
            -e 's|^INPUT.*|INPUT                  = lib/include|' \
            -e 's|^RECURSIVE.*|RECURSIVE              = YES|' \
            Doxyfile > Doxyfile.ci
          doxygen Doxyfile.ci
          
          python scripts/generate_api_rst.py \
            --index-xml docs/_build/doxygen/xml/index.xml \
            --output docs/api.rst \
            --project HTTPServer
            
          python -m sphinx -b html docs docs/_build/html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

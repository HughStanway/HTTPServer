[ports]
server_port = 443
http_redirection_port = 80

[https]
enable_https = true
cert_file = ".env/cert.pem"
key_file = ".env/key.pem"
enable_http_redirection = true

[idle-ip-cleanup]
interval_minutes = 10
idle_timeout_minutes = 5

[network]
client_timeout_seconds = 5
default_http_redirection_port = 80
recv_buffer_size = 4096

[threading]
min_threads = 4
max_threads = 32
max_queue_size = 1024

[rate-limits]
max_connections_per_ip = 10
max_keep_alive_requests = 100
max_tokens = 10.0
refill_rate = 5.0

[http-config]
max_header_bytes = 16384
max_body_bytes = 10485760
allowed_methods = ["GET", "POST"]
allowed_versions = ["HTTP/1.0", "HTTP/1.1"]

[logging]
log_level = "INFO"
file_logging_enabled = false